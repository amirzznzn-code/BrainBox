<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainBox – Everything You Need. One Smart Place.</title>
<style>
:root{--bg:#f4f5fb;--panel:#fff;--card:#fff;--bd:#dfe2f0;--tx:#161a2e;--mu:#667090;--p:#7c4dff;--b:#2f6bff;--grad:linear-gradient(135deg,#7c4dff,#2f6bff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d17;--panel:#0f1222;--card:#141831;--bd:#262b4d;--tx:#eef0ff;--mu:#9aa3c7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d17;--panel:#0f1222;--card:#141831;--bd:#262b4d;--tx:#eef0ff;--mu:#9aa3c7;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--panel);border-right:1px solid var(--bd);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.logo{font-size:24px;font-weight:800;display:flex;gap:8px;align-items:center;margin:0 6px 4px}.logo b{background:var(--grad);-webkit-background-clip:text;color:transparent}
.tag{font-size:12px;color:var(--mu);margin:0 6px 18px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mu);margin-bottom:2px}
nav a:hover{background:var(--card);color:var(--tx)}nav a.on{background:var(--grad);color:#fff}
main{flex:1;min-width:0;padding:18px 26px 40px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.search{flex:1;max-width:560px;position:relative}
input,textarea,select{width:100%;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--p);outline-offset:1px}
textarea{min-height:190px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
.btn{background:var(--grad);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn:hover{filter:brightness(1.1)}
.hero{border-radius:20px;padding:38px 34px;background:radial-gradient(900px 300px at 85% 10%,#5b3df088,transparent),linear-gradient(135deg,#1b1450,#0f2a7a);color:#fff;margin-bottom:26px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5vw,50px);line-height:1.05;margin:0 0 12px;letter-spacing:-.02em}
.hero h1 span{background:linear-gradient(90deg,#b48cff,#5fb0ff);-webkit-background-clip:text;color:transparent}
.hero p{max-width:520px;opacity:.85;margin:0 0 20px}.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn.ghost{color:#fff;border-color:#ffffff55}
.stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}.stats div{font-size:13px;opacity:.85}.stats b{display:block;font-size:20px}
h2{font-size:19px;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:block;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--p)}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;margin-bottom:10px;color:#fff}
.card h3{margin:0 0 2px;font-size:15px}.card p{margin:0;color:var(--mu);font-size:13px}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:#7c4dff26;color:var(--p);margin-top:8px}
.fav{float:right;background:none;border:0;font-size:12px;color:var(--mu)}.fav.on{color:#f5b301}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:820px){aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;z-index:20;padding:6px;border-top:1px solid var(--bd);border-right:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
aside .logo,aside .tag{display:none}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}main{padding:14px 14px 90px}.ws{grid-template-columns:1fr}}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.opts select,.opts input{width:auto}
.lbl{font-size:13px;color:var(--mu);margin-bottom:6px}
.big{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:20px 0}
.price{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.price .card.hot{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}.price b.n{font-size:32px;display:block;margin:6px 0}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:9px 18px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}.note{color:var(--mu);font-size:12.5px}
.note-banner{background:#7c4dff18;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--mu);margin-bottom:16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.top{justify-content:space-between}.logo{color:var(--tx)}
.bell{position:relative;font-size:14px;color:var(--tx);background:none;border:0}.bell i{position:absolute;top:-6px;right:-6px;background:#f43f5e;color:#fff;font:700 10px/16px sans-serif;width:16px;height:16px;border-radius:50%;text-align:center}
.user{display:flex;gap:10px;align-items:center;font-weight:600}.av{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff}
.pro{margin-top:16px;padding:14px;border:1px solid var(--bd);border-radius:14px;text-align:center;background:linear-gradient(160deg,#7c4dff22,transparent)}.pro p{font-size:12px;color:var(--mu);margin:4px 0 10px}
.sb{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px}.dg .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.dh{border-radius:18px;padding:30px;min-height:270px;position:relative;overflow:hidden;color:#fff;border:1px solid #3a3fa0;background:radial-gradient(420px 260px at 78% 45%,#4b3cf0b0,transparent),linear-gradient(135deg,#171b70,#0b1242)}
.dh h1,.lhero h1{font-size:clamp(30px,4.4vw,48px);line-height:1.05;margin:0 0 10px;letter-spacing:-.02em}.dh h1 span,.lhero h1 span{background:linear-gradient(90deg,#8b5cf6,#38bdf8);-webkit-background-clip:text;color:transparent}
.dh p{max-width:340px;opacity:.85}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.dh .btn.ghost{color:#fff;border-color:#ffffff66}
.rob{position:absolute;right:20px;top:10px;width:260px;height:250px}.rob svg{position:absolute;right:20px;top:20px}
.rob i,.tb i{position:absolute;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:20px;background:#2a3190;border:1px solid #5560e0;color:#fff;box-shadow:0 6px 20px #0006}
.bar{font-size:18px;justify-content:flex-start}.bar:before{content:"";width:4px;height:20px;background:var(--p);border-radius:2px;margin-right:8px}.bar a{margin-left:auto}
.rc{display:grid;gap:12px;align-content:start}.st{display:flex;gap:12px;align-items:center;padding:12px}.st .ic{margin:0}.st b{font-size:20px;display:block}
.gp{background:linear-gradient(160deg,#4a2bd8,#1a2a8a);color:#fff;border:0}.gp p{opacity:.85}
.ra{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:13px}.ra .ic{width:32px;height:32px;margin:0;font-size:15px;border-radius:8px}
.feat{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-top:18px}.feat>div{flex:1;min-width:170px;font-size:13px}.feat b{display:block;font-size:14px}.feat .end{background:var(--grad);color:#fff;border-radius:10px;padding:14px;font-weight:700;text-align:center}
.tl{display:flex;gap:12px;align-items:flex-start}.tl .ic{flex-shrink:0;margin:0}
body.land aside,body.land .top{display:none}body.land main{padding:0}
.ln{background:radial-gradient(800px 400px at 80% 10%,#4b2fe055,transparent),var(--bg)}
.lh{display:flex;align-items:center;gap:20px;padding:14px 32px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.lk{display:flex;gap:6px;margin:0 auto}.lk a{padding:8px 14px;border-radius:10px;color:var(--mu)}.lk a.on{background:var(--grad);color:#fff}.lr{display:flex;gap:8px}
.lhero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;padding:36px 32px 10px;align-items:center}
.chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:6px 14px;font-size:14px;margin-bottom:16px}.chip b{color:#38bdf8;font-weight:500}
.lhero p{color:var(--mu);font-size:18px;max-width:520px}
.sb2{display:flex;background:#fff;border-radius:99px;padding:4px;max-width:560px;margin:16px 0}.sb2 input{border:0;background:transparent;color:#222;border-radius:99px}.sb2 .btn{border-radius:99px;white-space:nowrap}
.tb{position:relative;height:360px}.tb .box{position:absolute;left:12%;right:8%;bottom:30px;height:150px;border-radius:18px;background:linear-gradient(160deg,#4b4fe8,#1e2a9a);border:1px solid #7f8bff;display:grid;place-items:center;font-size:34px;text-align:center;color:#fff;box-shadow:0 0 60px #6d4aff88}.tb .box b{display:block;font-size:26px}
.lp{padding:10px 32px 30px}.lp .grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.lp h2{font-size:22px}
@media(max-width:820px){.dg,.lhero{grid-template-columns:1fr}.rob{display:none}.pro,.sb .note{display:none}.lk{display:none}.lh{padding:12px 16px}.lhero,.lp{padding-left:16px;padding-right:16px}.tb{height:300px}}
.ic,.rob i,.tb i{display:none}
.pm label{display:flex;gap:6px;align-items:center}
</style></head>
<body><div class="app">
<aside><a href="#welcome" class="logo"> <b>BrainBox</b></a><div class="tag">Everything You Need</div><nav id="nav"></nav><div class="pro"><div style="font-size:22px"></div><b>Upgrade to Pro</b><p>Unlock more features and enjoy the full power!</p><a class="btn" href="#pricing" style="display:block">Go Pro </a></div><div class="sb"><button class="btn ghost" id="theme" aria-label="Toggle theme" style="padding:4px 12px"> Theme</button><span class="note"> English</span></div></aside>
<main><div class="top"><div class="search"><input id="q" placeholder="Search for tools… (Ctrl + K)" aria-label="Search tools"></div><div class="user"><span class="av" id="av">?</span><input id="un" placeholder="Enter your name" aria-label="Your name" maxlength="30" style="width:160px"></div></div><div id="view"></div></main>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const CATS={text:["Text Tools","","#6d4aff"],image:["Image Tools","","#1e9bff"],dev:["Developer Tools","</>","#22c55e"],prod:["Productivity Tools","","#f59e0b"],ai:["AI Tools","","#ec4899"]};
const store={get(k,d){try{const v=localStorage.getItem('bb_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('bb_'+k,JSON.stringify(v))}catch(e){}}};
let favs=store.get('favs',[]),recent=store.get('recent',[]);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)};
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Select the text and copy it manually')}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=s=>(s.trim().match(/\S+/g)||[]);
// text-style tools: run(input, opts) -> output
const T=[
{id:'word-counter',n:'Word Counter',c:'text',i:'Aa',d:'Count words, characters and reading time',run:s=>{const w=words(s).length;return `Words: ${w}\nCharacters: ${s.length}\nCharacters (no spaces): ${s.replace(/\s/g,'').length}\nSentences: ${(s.match(/[.!?]+(\s|$)/g)||[]).length}\nParagraphs: ${s.split(/\n\s*\n/).filter(x=>x.trim()).length}\nReading time: ${Math.max(w?1:0,Math.ceil(w/200))} min`}},
{id:'case-converter',n:'Case Converter',c:'text',i:'Tt',d:'Change text to upper, lower, title or camel case',opt:[['mode',['UPPER','lower','Title','camelCase','snake_case','kebab-case']]],run:(s,o)=>{const w=s.toLowerCase().split(/[\s_-]+/).filter(Boolean);return({UPPER:()=>s.toUpperCase(),lower:()=>s.toLowerCase(),Title:()=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()),camelCase:()=>w.map((x,i)=>i?x[0].toUpperCase()+x.slice(1):x).join(''),snake_case:()=>w.join('_'),'kebab-case':()=>w.join('-')})[o.mode]()}},
{id:'remove-duplicates',n:'Remove Duplicate Lines',c:'text',i:'',d:'Keep only unique lines',run:s=>[...new Set(s.split('\n'))].join('\n')},
{id:'sort-lines',n:'Sort Lines',c:'text',i:'',d:'Sort lines alphabetically',opt:[['order',['A to Z','Z to A']]],run:(s,o)=>{const a=s.split('\n').sort((x,y)=>x.localeCompare(y));return(o.order[0]=='Z'?a.reverse():a).join('\n')}},
{id:'json-formatter',n:'JSON Formatter',c:'dev',i:'{ }',d:'Format, validate and minify JSON',opt:[['mode',['Beautify','Minify']]],run:(s,o)=>{const j=JSON.parse(s);return o.mode=='Minify'?JSON.stringify(j):JSON.stringify(j,null,2)}},
{id:'base64',n:'Base64 Encode / Decode',c:'dev',i:'64',d:'Convert text to and from Base64',opt:[['mode',['Encode','Decode']]],run:(s,o)=>o.mode=='Encode'?btoa(String.fromCharCode(...new TextEncoder().encode(s))):new TextDecoder().decode(Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0)))},
{id:'url-encoder',n:'URL Encoder / Decoder',c:'dev',i:'%',d:'Encode or decode URL components',opt:[['mode',['Encode','Decode']]],run:(s,o)=>o.mode=='Encode'?encodeURIComponent(s):decodeURIComponent(s)},
{id:'timestamp',n:'Timestamp Converter',c:'dev',i:'',d:'Unix timestamp to date and back',run:s=>{s=s.trim();if(/^\d+$/.test(s)){const d=new Date(s.length<=10?+s*1e3:+s);return d.toISOString()+'\n'+d.toString()}const d=new Date(s);if(isNaN(d))throw Error('Enter a Unix timestamp or a date like 2026-01-31');return 'Seconds: '+Math.floor(d/1e3)+'\nMilliseconds: '+d.getTime()}},
{id:'hash-generator',n:'Hash Generator',c:'dev',i:'#',d:'SHA-1, SHA-256 and SHA-512 hashes',opt:[['algo',['SHA-256','SHA-1','SHA-512']]],async:1,run:async(s,o)=>[...new Uint8Array(await crypto.subtle.digest(o.algo,new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')},
{id:'text-summarizer',n:'Text Summarizer',c:'ai',i:'',d:'Pick the most important sentences (runs in your browser)',opt:[['sentences',['2','3','5']]],run:(s,o)=>{const ss=s.match(/[^.!?]+[.!?]*/g)||[],f={};words(s.toLowerCase()).forEach(w=>{w=w.replace(/\W/g,'');if(w.length>3)f[w]=(f[w]||0)+1});const sc=ss.map((x,i)=>[i,words(x.toLowerCase()).reduce((a,w)=>a+(f[w.replace(/\W/g,'')]||0),0)/(words(x).length||1)]);return sc.sort((a,b)=>b[1]-a[1]).slice(0,+o.sentences).sort((a,b)=>a[0]-b[0]).map(x=>ss[x[0]].trim()).join(' ')}},
{id:'keyword-extractor',n:'Keyword Extractor',c:'ai',i:'',d:'Find the most frequent meaningful words',run:s=>{const stop=new Set('the and for that with this from have are was were but not you your they them will would there their what when which about into than then also can has had its our out all any'.split(' '));const f={};words(s.toLowerCase()).forEach(w=>{w=w.replace(/[^a-z0-9']/g,'');if(w.length>3&&!stop.has(w))f[w]=(f[w]||0)+1});return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([w,n])=>w+' — '+n).join('\n')||'No keywords found'}},
];
const SPECIAL=[
{id:'image-compressor',n:'Image Compressor',c:'image',i:'',d:'Shrink images in your browser — files never leave your device'},
{id:'password-generator',n:'Password Generator',c:'dev',i:'',d:'Create strong random passwords'},
{id:'pomodoro-timer',n:'Pomodoro Timer',c:'prod',i:'',d:'Focus for 25 minutes, then rest'},
{id:'todo-list',n:'To-do List',c:'prod',i:'',d:'Simple tasks saved on this device'},
];
const ALL=[...T,...SPECIAL];
const col=c=>CATS[c][2];
const icon=t=>`<div class="ic" style="background:${col(t.c)}">${t.i}</div>`;
const card=t=>`<a class="card" href="#tool-${t.id}"><button class="fav ${favs.includes(t.id)?'on':''}" data-f="${t.id}" aria-label="Favorite">${favs.includes(t.id)?'Saved':'Save'}</button>${icon(t)}<h3>${t.n}</h3><p>${t.d}</p><span class="pill">${CATS[t.c][0].split(' ')[0]}</span></a>`;
const grid=l=>l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<p class="note">Nothing here yet. Open a tool and tap  to save it.</p>`;
const NAV=[['home','','Home'],['explore','','Explore Tools'],...Object.entries(CATS).map(([k,v])=>['cat-'+k,v[1].length>2?'‹›':v[1],v[0]]),['favorites','','Favorites'],['recent','','Recently Used'],['dashboard','','Dashboard'],['prefs','','Settings']];
function nav(r){$('#nav').innerHTML=NAV.map(([h,i,l])=>(h=='favorites'?'<hr style="border:0;border-top:1px solid var(--bd);margin:10px 0">':'')+`<a href="#${h}" class="${r==h?'on':''}"><span>${i}</span>${l}</a>`).join('')}
const RB=`<svg viewBox="0 0 200 200" width="220" height="220"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9c4ff"/></linearGradient></defs><ellipse cx="100" cy="182" rx="85" ry="11" fill="#5b6cff66"/><rect x="45" y="105" width="110" height="68" rx="30" fill="url(#rg)"/><rect x="62" y="125" width="76" height="38" rx="9" fill="#3b5bff"/><rect x="38" y="28" width="124" height="88" rx="40" fill="url(#rg)"/><rect x="52" y="42" width="96" height="60" rx="26" fill="#0b1030"/><path d="M72 76q9-12 18 0M110 76q9-12 18 0M92 88q8 7 16 0" stroke="#4fd1ff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="30" cy="72" r="9" fill="#8ea2ff"/><circle cx="170" cy="72" r="9" fill="#8ea2ff"/></svg>`;
const TL=(id,sub,tag)=>{const t=ALL.find(x=>x.id==id);return `<a class="card tl" href="#tool-${id}">${icon(t)}<div><h3>${t.n}</h3><p>${sub}</p><span class="pill" style="background:${col(t.c)}33;color:${col(t.c)}">${tag}</span></div></a>`};
const CS=[['text','15+ tools','Work with text easily'],['image','12+ tools','Edit & optimize images'],['dev','20+ tools','Code & develop better'],['prod','15+ tools','Boost your productivity'],['ai','10+ tools','Powered by AI']];
const cc=(k,s)=>`<a class="card" href="#cat-${k}"><div class="ic" style="background:${col(k)}">${CATS[k][1]}</div><h3>${CATS[k][0]}</h3><p>${s}</p></a>`;
const FT=[['','Fast & Easy','Get things done quickly'],['','Free Online Tools','No registration required'],['','Secure & Private','Your data is safe'],['','No Installation','Works in your browser']];
function dash(){const ra=recent.length?recent.slice(0,3).map(id=>ALL.find(t=>t.id==id)).filter(Boolean).map(t=>[t.i,col(t.c),'Used '+t.n]):[['','#1e9bff','Used Image Compressor'],['Aa','#7c4dff','Used Word Counter'],['','#ec4899','Added to favorites']];
return `<div class="dg"><div><div class="dh"><h1>Your Digital Toolbox,<br><span>Reimagined.</span></h1><p>Powerful tools for everything you do, all in one place.</p><div class="row"><a class="btn" href="#explore"> Explore Tools </a><button class="btn ghost" onclick="toast('Demo video coming soon')"> Watch Demo</button></div><div class="rob">${RB}<i style="top:6%;left:0"></i><i style="top:0;right:4%">&lt;/&gt;</i><i style="top:42%;right:-4%">T</i><i style="bottom:2%;right:6%"></i></div></div>
<h2 class="bar">Popular Categories <a href="#explore" class="note">View All </a></h2><div class="grid">${CS.map(c=>cc(c[0],c[1])).join('')}</div>
<h2 class="bar">Popular Tools <a href="#explore" class="note">View All </a></h2><div class="grid">${TL('word-counter','Count words & characters','Text')+TL('image-compressor','Reduce image size','Image')+TL('json-formatter','Format JSON data','Developer')+TL('pomodoro-timer','Focus & be productive','Productivity')}</div></div>

function checkout(p){const pl=PLANS[p];if(!pl)return '<h2>Plan not found</h2><a class="btn" href="#pricing">See plans</a>';

function wirePay(p){const pl=PLANS[p];if(!pl)return;const eg=PAY.egp[p],amt=eg?eg+' EGP (about $'+pl[1]+')':'$'+pl[1]+' (pay the equivalent in EGP)';
const mth=()=>document.querySelector('[name=pm]:checked').value;
const show=()=>{const m=mth(),d=PAY[m],num=m=='vodafone'?d.num:d.id;$('#pi').innerHTML=num?`<p>Amount: <b>${amt}</b></p><p>${m=='vodafone'?'Vodafone Cash number':'InstaPay address'}: <b id="pv">${esc(num)}</b> <button class="btn ghost" style="padding:2px 10px" onclick="copy(document.getElementById('pv').textContent)">Copy</button></p><p>Account name: <b>${esc(d.name)}</b></p><ol class="note"><li>Open ${m=='vodafone'?'Vodafone Cash':'InstaPay or your bank app'}.</li><li>Send exactly the amount above.</li><li>Keep the confirmation message or a screenshot.</li></ol>`:'<p class="note" style="color:#ef4444">Payment details for this method have not been set yet.</p>'};
document.querySelectorAll('[name=pm]').forEach(r=>r.onchange=show);show();$('#pn').value=store.get('name','');
$('#pd').onclick=()=>{const g=i=>$('#'+i).value.trim();if(!g('pn')||!g('pp')||!g('pr')){$('#pm2').textContent='Enter your name, phone number and the transfer reference.';return}
const rq={plan:pl[0],method:mth()=='vodafone'?'Vodafone Cash':'InstaPay',name:g('pn'),phone:g('pp'),email:g('pe'),ref:g('pr'),at:new Date().toISOString()};const L=store.get('payreq',[]);L.push(rq);store.set('payreq',L);
const msg=`BrainBox payment\nPlan: ${rq.plan} ($${pl[1]}/month)\nMethod: ${rq.method}\nName: ${rq.name}\nPhone: ${rq.phone}\nEmail: ${rq.email||'-'}\nReference: ${rq.ref}`;
$('#pm2').innerHTML=`Request saved as <b>pending</b>.<br>`+(PAY.whatsapp?`<a class="btn" style="display:inline-block;margin:8px 0" target="_blank" rel="noopener" href="https://wa.me/${PAY.whatsapp}?text=${encodeURIComponent(msg)}">Send details on WhatsApp</a>`:`<button class="btn ghost" id="cm" style="margin:8px 0">Copy payment details</button>`)+`<br>Send these details with your transfer screenshot. We activate your plan after we confirm the payment.`;const c=$('#cm');if(c)c.onclick=()=>copy(msg)}}
let timer;
function route(){clearInterval(timer);document.body.classList.toggle('land',(location.hash||'#home')=='#welcome');const r=(location.hash||'#home').slice(1);nav(r);const v=$('#view');window.scrollTo(0,0);
 if(r=='home')v.innerHTML=dash();else if(r=='welcome')v.innerHTML=land();else if(r=='dashboard')v.innerHTML=statsPage();else if(r=='prefs')v.innerHTML=prefsPage();else if(false)v.innerHTML=`<div class="hero"><h1>Your Digital Toolbox, <span>Reimagined.</span></h1><p>Powerful tools for text, images, developers, productivity and AI — all in one place. Free, fast, and private in your browser.</p><div class="row"><a class="btn" href="#explore">Explore Tools</a><a class="btn ghost" href="#pricing">Get Started</a></div><div class="stats"><div><b>${ALL.length}</b>Tools available</div><div><b>0</b>Files uploaded</div><div><b>No sign-up</b>Needed to use</div></div></div>
 <h2>Popular Categories <a href="#explore" class="note">View all</a></h2><div class="grid">${Object.entries(CATS).map(([k,c])=>`<a class="card" href="#cat-${k}"><div class="ic" style="background:${c[2]}">${c[1]}</div><h3>${c[0]}</h3><p>${ALL.filter(t=>t.c==k).length} tools</p></a>`).join('')}</div>
 <h2>Popular Tools</h2>${grid(ALL.slice(0,8))}<h2>Why BrainBox?</h2><div class="grid">${[['','Fast and easy','Open a tool and get your result in seconds.'],['','Free online tools','No registration required.'],['','Private processing','Your text and images stay in your browser.'],['','No installation','Works on any modern browser.']].map(f=>`<div class="card"><h3>${f[0]} ${f[1]}</h3><p>${f[2]}</p></div>`).join('')}</div>
 <div class="note-banner" style="margin-top:22px">Sample testimonials will appear here once real user reviews exist.</div>`;
 else if(r=='explore')v.innerHTML='<h2>Explore Tools</h2>'+grid(ALL);
 else if(r.startsWith('cat-')){const k=r.slice(4);v.innerHTML=`<h2>${CATS[k]?CATS[k][0]:''}</h2>`+grid(ALL.filter(t=>t.c==k))}
 else if(r=='favorites')v.innerHTML='<h2>Favorites</h2>'+grid(favs.map(id=>ALL.find(t=>t.id==id)).filter(Boolean));
 else if(r=='recent')v.innerHTML='<h2>Recently Used</h2>'+grid(recent.map(id=>ALL.find(t=>t.id==id)).filter(Boolean));
 else if(r.startsWith('checkout-')){v.innerHTML=checkout(r.slice(9));wirePay(r.slice(9))}else if(r=='pricing')v.innerHTML=`<h2>Pricing</h2><div class="note-banner">Pay by Vodafone Cash or InstaPay. Your plan is activated after we confirm your transfer.</div><div class="price">${[['Free','$0','All tools, local processing, favorites and history on this device'],['Pro','$7','Unlimited AI usage, larger files, cloud sync',1],['Team','$19','Shared workspaces and admin controls']].map(p=>`<div class="card ${p[3]?'hot':''}"><h3>${p[0]}</h3><b class="n">${p[1]}<span class="note"> /month</span></b><p>${p[2]}</p><br><a class="btn ${p[3]?'':'ghost'}" style="display:inline-block" href="${p[0]=='Free'?'#explore':'#checkout-'+p[0].toLowerCase()}">${p[0]=='Free'?'Start free':'Subscribe'}</a></div>`).join('')}</div>`;
 else if(r.startsWith('tool-'))tool(r.slice(5));
 else location.hash='#home';
}
function tool(id){const t=ALL.find(x=>x.id==id),v=$('#view');if(!t){location.hash='#explore';return}
 recent=[id,...recent.filter(x=>x!=id)].slice(0,12);store.set('recent',recent);
 const head=`<div style="display:flex;gap:14px;align-items:center;margin-bottom:6px">${icon(t)}<div><h2 style="margin:0">${t.n}</h2><span class="note">${t.d}</span></div></div>`;
 if(t.run){
  v.innerHTML=head+`<div class="opts">${(t.opt||[]).map(([k,o])=>`<label>${k[0].toUpperCase()+k.slice(1)} <select data-o="${k}">${o.map(x=>`<option>${x}</option>`).join('')}</select></label>`).join('')}<button class="btn" id="go">Process</button><button class="btn ghost" id="clr">Clear</button></div><div class="ws"><div><div class="lbl">Input</div><textarea id="in" placeholder="Type or paste here…"></textarea></div><div><div class="lbl">Output <button class="btn ghost" id="cp" style="padding:2px 12px;margin-left:8px">Copy</button></div><textarea id="out" readonly></textarea><div class="note" id="err" role="alert" style="color:#ef4444"></div></div></div>`;
  const go=async()=>{const o={};document.querySelectorAll('[data-o]').forEach(s=>o[s.dataset.o]=s.value);try{$('#err').textContent='';$('#out').value=await t.run($('#in').value,o)}catch(e){$('#out').value='';$('#err').textContent='Could not process this input: '+e.message}};
  $('#go').onclick=go;$('#in').oninput=()=>{if(['word-counter','case-converter'].includes(id))go()};$('#clr').onclick=()=>{$('#in').value='';$('#out').value='';$('#err').textContent=''};$('#cp').onclick=()=>copy($('#out').value);return}
 if(id=='password-generator'){v.innerHTML=head+`<div class="card" style="margin-top:14px;max-width:560px"><div class="lbl">Length: <b id="ln">20</b></div><input type="range" id="len" min="8" max="64" value="20"><div class="opts"><label><input type="checkbox" id="u" checked style="width:auto"> A–Z</label><label><input type="checkbox" id="l" checked style="width:auto"> a–z</label><label><input type="checkbox" id="d" checked style="width:auto"> 0–9</label><label><input type="checkbox" id="s" checked style="width:auto"> Symbols</label></div><input id="pw" readonly style="font-family:ui-monospace,monospace"><div class="opts"><button class="btn" id="go">Generate</button><button class="btn ghost" id="cp">Copy</button></div></div>`;
  const gen=()=>{let c='';if($('#u').checked)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if($('#l').checked)c+='abcdefghijklmnopqrstuvwxyz';if($('#d').checked)c+='0123456789';if($('#s').checked)c+='!@#$%^&*()-_=+[]{}?';if(!c){$('#pw').value='';toast('Select at least one character set');return}const n=+$('#len').value,a=crypto.getRandomValues(new Uint32Array(n));$('#pw').value=[...a].map(x=>c[x%c.length]).join('')};
  $('#len').oninput=()=>{$('#ln').textContent=$('#len').value;gen()};$('#go').onclick=gen;$('#cp').onclick=()=>copy($('#pw').value);gen();return}
 if(id=='pomodoro-timer'){let m=[25,5][0],left=25*60,run=0,mode='Focus';v.innerHTML=head+`<div class="card" style="max-width:420px;margin-top:14px;text-align:center"><div class="lbl" id="md">Focus</div><div class="big" id="tm">25:00</div><div class="opts" style="justify-content:center"><button class="btn" id="st">Start</button><button class="btn ghost" id="rs">Reset</button><button class="btn ghost" id="sw">Switch mode</button></div></div>`;
  const draw=()=>{$('#tm').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('#md').textContent=mode;document.title=run?$('#tm').textContent+' · BrainBox':'BrainBox'};
  const tick=()=>{if(!run)return;left--;if(left<=0){run=0;$('#st').textContent='Start';toast(mode+' session finished')}draw()};
  timer=setInterval(tick,1000);$('#st').onclick=()=>{run=!run;$('#st').textContent=run?'Pause':'Start'};$('#rs').onclick=()=>{run=0;left=(mode=='Focus'?25:5)*60;$('#st').textContent='Start';draw()};$('#sw').onclick=()=>{mode=mode=='Focus'?'Break':'Focus';$('#rs').click()};return}
 if(id=='todo-list'){let L=store.get('todos',[]);v.innerHTML=head+`<div class="card" style="max-width:560px;margin-top:14px"><div class="opts" style="margin-top:0"><input id="ti" placeholder="Add a task" style="flex:1"><button class="btn" id="ad">Add task</button></div><div id="tl"></div></div>`;
  const draw=()=>{store.set('todos',L);$('#tl').innerHTML=L.length?L.map((x,i)=>`<div class="opts" style="margin:6px 0"><label style="flex:1;${x.d?'text-decoration:line-through;opacity:.6':''}"><input type="checkbox" data-i="${i}" ${x.d?'checked':''} style="width:auto"> ${esc(x.t)}</label><button class="btn ghost" data-x="${i}" style="padding:2px 10px">Delete</button></div>`).join(''):'<p class="note">No tasks yet. Add your first one above.</p>';$('#tl').querySelectorAll('[data-i]').forEach(c=>c.onchange=()=>{L[c.dataset.i].d=c.checked;draw()});$('#tl').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{L.splice(b.dataset.x,1);draw()})};
  const add=()=>{const t=$('#ti').value.trim();if(t){L.push({t,d:0});$('#ti').value='';draw()}};$('#ad').onclick=add;$('#ti').onkeydown=e=>e.key=='Enter'&&add();draw();return}
 if(id=='image-compressor'){v.innerHTML=head+`<div class="card" style="margin-top:14px"><input type="file" id="f" accept="image/*"><div class="opts"><label>Quality <input type="range" id="qq" min="10" max="100" value="70" style="width:160px"> <b id="qv">70%</b></label><label>Max width <input id="mw" type="number" value="1920" style="width:100px"></label><button class="btn" id="go">Compress</button></div><div id="res" class="note">Choose an image to begin. It is processed on your device only.</div></div>`;
  $('#qq').oninput=()=>$('#qv').textContent=$('#qq').value+'%';
  $('#go').onclick=()=>{const f=$('#f').files[0];if(!f){toast('Choose an image first');return}const img=new Image();img.onload=()=>{const s=Math.min(1,(+$('#mw').value||img.width)/img.width),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const u=URL.createObjectURL(b),k=n=>(n/1024).toFixed(1)+' KB';$('#res').innerHTML=`<p>${k(f.size)} to <b>${k(b.size)}</b> (${Math.round((1-b.size/f.size)*100)}% ${b.size<f.size?'smaller':'larger — try lower quality'})</p><img src="${u}" style="max-width:100%;max-height:320px;border-radius:12px"><br><br><a class="btn" href="${u}" download="compressed-${f.name.replace(/\.\w+$/,'')}.jpg">Download</a>`},'image/jpeg',+$('#qq').value/100)};img.onerror=()=>toast('That file could not be read as an image');img.src=URL.createObjectURL(f)};return}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){e.preventDefault();e.stopPropagation();const id=b.dataset.f;favs=favs.includes(id)?favs.filter(x=>x!=id):[...favs,id];store.set('favs',favs);b.classList.toggle('on');b.textContent=b.classList.contains('on')?'Saved':'Save';toast(favs.includes(id)?'Added to favorites':'Removed from favorites');if(location.hash=='#favorites')route()}});
$('#q').oninput=e=>{const q=e.target.value.toLowerCase().trim();if(!q){route();return}$('#view').innerHTML=`<h2>Results for “${esc(q)}”</h2>`+(ALL.filter(t=>(t.n+t.d+CATS[t.c][0]).toLowerCase().includes(q)).length?grid(ALL.filter(t=>(t.n+t.d+CATS[t.c][0]).toLowerCase().includes(q))):'<p class="note">No tools match. Try “json”, “image” or “timer”.</p>')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();$('#q').focus()}if(e.key=='/'&&document.activeElement.tagName!='INPUT'&&document.activeElement.tagName!='TEXTAREA'){e.preventDefault();$('#q').focus()}});
$('#theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()=='#0b0d17';d.dataset.theme=dark?'light':'dark';store.set('theme',d.dataset.theme)};
const un=$('#un'),av=$('#av'),setN=()=>{av.textContent=(un.value.trim()[0]||'?').toUpperCase()};un.value=store.get('name','');un.oninput=()=>{store.set('name',un.value.trim());setN()};setN();
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
addEventListener('hashchange',()=>{$('#q').value='';route()});route();
</script></body></html>
